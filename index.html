<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saints Hockey Schedule</title>
  
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#07121f;
  --bg2:#09211f;
  --panel:#0d1828;
  --panel2:#101d30;
  --line:#263850;
  --muted:#94a9c3;
  --text:#eef6ff;
  --accent:#2dd4bf;
  --accent2:#38bdf8;
  --danger:#fb7185;
  --warn:#fbbf24;
  --shadow:0 18px 45px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:'Outfit',Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 80% 18%, rgba(45,212,191,.16), transparent 34%),
    linear-gradient(180deg,var(--bg),#06101d 62%,#050b14);
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:linear-gradient(180deg,rgba(6,16,29,.12),rgba(6,16,29,.78));
  pointer-events:none;
}
header{
  width:min(980px,calc(100% - 28px));
  margin:22px auto 10px;
  padding:0;
  background:transparent;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  position:relative;
  z-index:1;
}
.crest{
  width:44px;
  height:44px;
  object-fit:contain;
  margin:0;
  border-radius:14px;
  padding:4px;
  background:rgba(255,255,255,.92);
  box-shadow:0 10px 28px rgba(0,0,0,.25);
  flex:0 0 auto;
}
header h1{
  margin:0;
  font-size:20px;
  line-height:1.1;
  font-weight:800;
  letter-spacing:-.02em;
}
.header-tagline{
  margin:3px 0 0;
  font-size:11px;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}
.container{
  width:min(980px,calc(100% - 28px));
  margin:0 auto;
  padding:0 0 40px;
  position:relative;
  z-index:1;
}
.announcement-box,.toolbar,.announcement-entry,.card,.empty,.loading,.error{
  background:rgba(13,24,40,.86);
  border:1px solid rgba(148,169,195,.20);
  border-radius:16px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
}
.announcement-box{
  padding:12px;
  margin:10px 0 12px;
  border-left:3px solid var(--accent);
}
.announcement-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  color:var(--text);
  font-weight:800;
  font-size:14px;
}
.announcement-list{
  max-height:82px;
  overflow-y:auto;
  padding-right:4px;
}
.announcement-item{
  background:rgba(16,29,48,.88);
  border:1px solid rgba(148,169,195,.16);
  border-radius:12px;
  padding:8px 10px;
  margin-bottom:6px;
  font-size:12px;
  line-height:1.35;
  color:#dbeafe;
}
.announcement-date{
  font-size:10px;
  color:var(--accent2);
  font-weight:800;
  margin-bottom:3px;
}
.delete-announcement{
  margin-top:6px;
  border:1px solid rgba(248,113,113,.45);
  background:linear-gradient(180deg,rgba(127,29,29,.55),rgba(69,10,10,.45));
  color:#fecaca;
  border-radius:8px;
  padding:5px 9px;
  font-size:10px;
  font-weight:800;
  cursor:pointer;
}
.toolbar{
  padding:10px;
  margin-bottom:12px;
}
.toolbar > div:first-child{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}
label{
  font-size:10px;
  font-weight:800;
  color:var(--muted);
  display:block;
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
input,textarea,select{
  width:100%;
  padding:10px 12px;
  border:1px solid rgba(148,169,195,.24);
  border-radius:12px;
  font-size:13px;
  outline:none;
  background:#07101d;
  color:var(--text);
}
textarea{min-height:74px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:rgba(45,212,191,.65);box-shadow:0 0 0 3px rgba(45,212,191,.10)}
.quick-actions{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 12px}
.btn,.small-btn{
  border:1px solid rgba(125,178,255,.24);
  border-radius:9px;
  padding:6px 10px;
  background:linear-gradient(180deg,rgba(20,39,63,.96),rgba(10,20,35,.96));
  color:#eaf4ff;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:11px;
  line-height:1;
  min-height:28px;
  letter-spacing:.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 16px rgba(0,0,0,.18);
  transition:transform .14s ease,border-color .14s ease,background .14s ease,box-shadow .14s ease;
}
.btn:hover,.small-btn:hover{border-color:rgba(96,165,250,.62);background:linear-gradient(180deg,rgba(21,50,82,.98),rgba(10,24,43,.98));transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 9px 22px rgba(0,0,0,.24)}
.btn:active,.small-btn:active{transform:translateY(0)}
.btn{background:linear-gradient(180deg,#0b67d8,#0754b6);border-color:rgba(96,165,250,.65);color:#fff}
.btn.secondary{background:linear-gradient(180deg,rgba(15,27,45,.96),rgba(8,17,31,.96));color:#dbeafe;border-color:rgba(148,169,195,.24)}
.small-btn{padding:5px 9px;min-height:26px;font-size:10.5px}
.card-actions .small-btn:last-child{background:linear-gradient(180deg,#0b67d8,#0754b6);border-color:rgba(96,165,250,.60);color:white}
.term-title{
  margin:18px 0 8px;
  font-size:13px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.11em;
  font-weight:800;
}
.schedule-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  max-height:none;
  overflow:visible;
  padding:0;
}
.card{
  padding:10px 12px;
  width:100%;
  min-height:0;
}
.card-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-start;
  margin-bottom:8px;
}
.date{font-size:16px;font-weight:800;color:#ffffff;letter-spacing:-.01em}
.day{
  background:rgba(45,212,191,.12);
  color:#99f6e4;
  border:1px solid rgba(45,212,191,.28);
  padding:4px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}
.info{
  display:grid;
  grid-template-columns:66px 1fr;
  gap:4px 8px;
  margin:5px 0;
  font-size:12px;
  color:#dbeafe;
}
.info span:first-child{
  color:var(--muted);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  font-size:10px;
}
.tag{
  display:inline-block;
  background:rgba(56,189,248,.12);
  color:#bae6fd;
  border:1px solid rgba(56,189,248,.22);
  padding:4px 7px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  margin-top:4px;
}
.card-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:9px;
  border-top:1px solid rgba(148,169,195,.13);
  padding-top:8px;
}
.announcement-entry{
  padding:12px;
  margin-top:14px;
}
.announcement-entry h2{
  margin:0 0 10px;
  font-size:15px;
  color:#fff;
}
.form-row{margin-bottom:8px}
.empty,.loading,.error{
  padding:18px;
  text-align:center;
  color:var(--muted);
}
.error{border-color:rgba(251,113,133,.45);color:#fecdd3;background:rgba(127,29,29,.25)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#29415c;border-radius:999px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:760px){
  header,.container{width:min(100% - 18px,980px)}
  header{margin-top:14px}
  .crest{width:38px;height:38px}
  header h1{font-size:18px}
  .toolbar > div:first-child{grid-template-columns:1fr}
  .schedule-grid{grid-template-columns:1fr}
}
</style>

</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTKW9nlCQK-1ktvEu8at4-KRLjIwbz660",
  authDomain: "saintshockeyattendance.firebaseapp.com",
  projectId: "saintshockeyattendance",
  storageBucket: "saintshockeyattendance.firebasestorage.app",
  messagingSenderId: "717790587080",
  appId: "1:717790587080:web:cd9e1a07d580566f3f1dfd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1-r7uyrReT36YhEF6xzx5YpnFG6Z-ycPp3XzfAaWUSP8/export?format=csv&gid=0";
const ADMIN_PIN = "Q7@mL2#x";
let schedule = [];

const fallbackMapLinks = {
  "PSOEB": "https://www.google.com/maps/search/?api=1&query=PSOEB",
  "Sengkang": "https://www.google.com/maps/search/?api=1&query=Sengkang+Hockey+Pitch",
  "School": "https://www.google.com/maps/search/?api=1&query=St+Andrew's+Junior+College"
};

function escapeHtml(text){return String(text ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function safeId(text){return String(text ?? "").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
function normaliseHeader(header){return String(header||"").toLowerCase().replace(/\s+/g,"")}

function checkPin(){
  const pin = prompt("Enter Admin PIN:");
  if(pin !== ADMIN_PIN){
    alert("Incorrect PIN.");
    return false;
  }
  return true;
}

function csvToRows(text){
  const rows=[];let row=[],cell="",insideQuotes=false;
  for(let i=0;i<text.length;i++){
    const char=text[i], next=text[i+1];
    if(char==='"'&&insideQuotes&&next==='"'){cell+='"';i++}
    else if(char==='"'){insideQuotes=!insideQuotes}
    else if(char===','&&!insideQuotes){row.push(cell.trim());cell=""}
    else if((char==='\n'||char==='\r')&&!insideQuotes){
      if(cell||row.length){row.push(cell.trim());rows.push(row);row=[];cell=""}
      if(char==='\r'&&next==='\n')i++;
    } else {cell+=char}
  }
  if(cell||row.length){row.push(cell.trim());rows.push(row)}
  return rows;
}

function scheduleDateObject(dateText){
  if(!dateText)return null;
  const monthMap={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const clean=String(dateText).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(clean)){const[y,m,d]=clean.split("-").map(Number);return new Date(y,m-1,d)}
  const parts=clean.split("-");
  if(parts.length>=2){const day=Number(parts[0]);const month=monthMap[String(parts[1]).slice(0,3).toLowerCase()];if(!isNaN(day)&&month!==undefined)return new Date(2026,month,day)}
  const parsed=new Date(clean);return isNaN(parsed.getTime())?null:parsed;
}

function isTodayOrFuture(item){
  const d=scheduleDateObject(item.date);
  if(!d)return true;
  const today=new Date();today.setHours(0,0,0,0);d.setHours(0,0,0,0);
  return d>=today;
}

function rowsToScheduleObjects(rows){
  if(!rows.length)return[];
  const headers=rows[0].map(normaliseHeader);
  return rows.slice(1).filter(row=>row.some(cell=>String(cell).trim()!=="")).map(row=>{
    const obj={};headers.forEach((header,index)=>obj[header]=row[index]||"");
    const item={
      term:obj.term||"2026 Schedule",
      date:obj.date||"",
      day:obj.day||"",
      start:obj.start||obj.starttime||"",
      end:obj.end||obj.endtime||"",
      venue:obj.venue||"",
      remarks:obj.remarks||"Training",
      coach:obj.coach||"",
      tic:obj.tic||"",
      standby:obj.standby||obj.j||"",
      mapLink:obj.maplink||"",
      attendanceLink:obj.attendancelink||""
    };
    item.id=safeId(`${item.date}-${item.day}-${item.start}-${item.end}-${item.venue}-${item.remarks}`);
    return item;
  }).filter(item=>item.date);
}

function makeMapLink(item){return item.mapLink || fallbackMapLinks[item.venue] || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.venue||"")}`}

function makeCalendarLink(item){
  const d=scheduleDateObject(item.date);
  const date=d?`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`:"20260101";
  const start=`${date}T${item.start||"0000"}00`;
  const end=`${date}T${item.end||"0100"}00`;
  const title=encodeURIComponent(`Hockey ${item.remarks||"Training"}`);
  const location=encodeURIComponent(item.venue||"");
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&location=${location}`;
}

async function loadSchedule(){
  const container=document.getElementById("scheduleContainer");
  container.innerHTML='<div class="loading">Loading schedule...</div>';
  try{
    const response=await fetch(SHEET_CSV_URL + "&cachebust=" + Date.now(), {cache:"no-store"});
    if(!response.ok)throw new Error("Unable to load CSV");
    const csvText=await response.text();
    schedule=rowsToScheduleObjects(csvToRows(csvText)).filter(isTodayOrFuture).sort((a,b)=>(scheduleDateObject(a.date)||new Date(9999,0,1))-(scheduleDateObject(b.date)||new Date(9999,0,1)));
    renderSchedule();
  }catch(err){
    console.error(err);
    container.innerHTML='<div class="error">Unable to load Google Sheet schedule. Make sure the sheet is shared/published and try Refresh.</div>';
  }
}

function renderSchedule(){
  const searchValue=document.getElementById("searchInput").value.toLowerCase();
  const filtered=schedule.filter(item=>Object.values(item).join(" ").toLowerCase().includes(searchValue));
  const grouped=filtered.reduce((acc,item)=>{const term=item.term||"Schedule";if(!acc[term])acc[term]=[];acc[term].push(item);return acc;},{});
  const container=document.getElementById("scheduleContainer");
  if(filtered.length===0){container.innerHTML='<div class="empty">No upcoming sessions found.</div>';return;}
  container.innerHTML=Object.keys(grouped).map(term=>`
    <h2 class="term-title">${escapeHtml(term)}</h2>
    <div class="schedule-grid">
      ${grouped[term].map(item=>`
        <article class="card">
          <div class="card-top"><div><div class="date">${escapeHtml(item.date)}</div><span class="tag">${escapeHtml(item.start)}–${escapeHtml(item.end)}</span></div><div class="day">${escapeHtml(item.day)}</div></div>
          <div class="info"><span>Venue</span><span>${escapeHtml(item.venue)}</span></div>
          <div class="info"><span>Remarks</span><span>${escapeHtml(item.remarks)}</span></div>
          <div class="info"><span>Coach</span><span>${escapeHtml(item.coach||"TBC")}</span></div>
          <div class="info"><span>TIC</span><span>${escapeHtml(item.tic||"TBC")}</span></div>
          <div class="info"><span>Standby</span><span>${escapeHtml(item.standby||"-")}</span></div>
          <div class="card-actions"><a class="small-btn" href="${makeMapLink(item)}" target="_blank">Map</a><a class="small-btn" href="${makeCalendarLink(item)}" target="_blank">Add</a><a class="small-btn" href="${item.attendanceLink || `attendance.html?session=${encodeURIComponent(item.id)}`}">Attendance</a></div>
        </article>
      `).join("")}
    </div>
  `).join("");
}

function loadAnnouncements(){
  const announcementList = document.getElementById("announcementList");
  announcementList.innerHTML = '<div class="loading">Loading announcements...</div>';

  const q = query(collection(db,"announcements"), orderBy("createdAt","desc"));

  onSnapshot(q, snapshot => {
    if(snapshot.empty){
      announcementList.innerHTML = `
        <div class="announcement-item">
          <div class="announcement-date">No announcement</div>
          <div>No announcements have been added yet.</div>
        </div>
      `;
      return;
    }

    announcementList.innerHTML = snapshot.docs.map(docSnap => {
      const item = docSnap.data();
      return `
        <div class="announcement-item">
          <div class="announcement-date">${escapeHtml(item.date || "Announcement")}</div>
          <div>${escapeHtml(item.text || "")}</div>
          <button class="delete-announcement" onclick="deleteAnnouncement('${docSnap.id}')">Delete</button>
        </div>
      `;
    }).join("");
  }, err => {
    console.error(err);
    announcementList.innerHTML = '<div class="error">Unable to load announcements.</div>';
  });
}

async function addAnnouncement(){
  if(!checkPin()) return;

  const date = document.getElementById("announcementDate").value.trim();
  const text = document.getElementById("announcementText").value.trim();

  if(!text){
    alert("Please type an announcement.");
    return;
  }

  await addDoc(collection(db,"announcements"),{
    date: date || "Announcement",
    text,
    createdAt: serverTimestamp()
  });

  clearAnnouncementForm();
}

async function deleteAnnouncement(id){
  if(!checkPin()) return;

  if(confirm("Delete this announcement?")){
    await deleteDoc(doc(db,"announcements",id));
  }
}

function clearAnnouncementForm(){
  document.getElementById("announcementDate").value = "";
  document.getElementById("announcementText").value = "";
}

document.getElementById("searchInput").addEventListener("input",renderSchedule);

window.loadSchedule=loadSchedule;
window.loadAnnouncements=loadAnnouncements;
window.addAnnouncement=addAnnouncement;
window.deleteAnnouncement=deleteAnnouncement;
window.clearAnnouncementForm=clearAnnouncementForm;

loadAnnouncements();
loadSchedule();
</script>
</body>
</html>
