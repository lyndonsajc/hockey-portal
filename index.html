<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hockey Team Schedule</title>
  <style>
    :root{--blue:#123c69;--blue2:#1f5f99;--light:#e8f1fb;--gold:#f6c453;--dark:#1f2937;--border:#d1d5db}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;color:var(--dark)}header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;padding:28px 16px;text-align:center}header h1{margin:0;font-size:30px}.container{max-width:1100px;margin:20px auto;padding:0 14px 36px}.toolbar{background:white;border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.05);margin-bottom:18px}label{font-size:12px;font-weight:bold;color:#4b5563;display:block;margin-bottom:5px}input{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:white}.quick-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.btn{border:none;border-radius:999px;padding:9px 13px;background:var(--blue);color:white;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:13px}.btn.secondary{background:white;color:var(--blue);border:1px solid var(--border)}.term-title{margin:26px 0 10px;font-size:25px;color:var(--blue)}.schedule-grid{display:flex;flex-direction:column;gap:14px;max-height:900px;overflow-y:auto;padding-right:6px}.schedule-grid::-webkit-scrollbar{width:8px}.schedule-grid::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}.schedule-grid::-webkit-scrollbar-track{background:#eef2f7;border-radius:999px}.card{background:white;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.05);width:100%}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.date{font-size:21px;font-weight:bold;color:var(--blue)}.day{background:var(--light);color:var(--blue);padding:6px 10px;border-radius:999px;font-size:13px;font-weight:bold}.info{display:grid;grid-template-columns:86px 1fr;gap:7px;margin:8px 0;font-size:14px}.info span:first-child{color:#6b7280;font-weight:bold}.tag{display:inline-block;background:#fff7df;color:#7a5200;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:bold;margin-top:4px}.card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;border-top:1px solid #eee;padding-top:12px}.small-btn{border-radius:10px;border:1px solid var(--border);padding:8px 10px;background:white;color:var(--blue);font-weight:bold;cursor:pointer;text-decoration:none;font-size:13px}.empty,.loading,.error{background:white;border:1px dashed var(--border);border-radius:16px;padding:20px;text-align:center;color:#6b7280}.error{border-color:#fca5a5;color:#991b1b;background:#fff5f5}details{margin-top:8px;background:#f9fafb;border-radius:10px;padding:9px 11px;font-size:13px}summary{cursor:pointer;font-weight:bold;color:var(--blue)}@media(max-width:760px){header h1{font-size:25px}.term-title{font-size:22px}}
  </style>
</head>
<body>
  <header><h1>Hockey Team Schedule 2026</h1></header>

  <main class="container">
    <section class="toolbar">
      <label for="searchInput">Search</label>
      <input id="searchInput" type="text" placeholder="Search date, coach, venue..." />
    </section>

    <div class="quick-actions">
      <a class="btn" href="attendance.html">✅ Take Attendance</a>
      <button class="btn secondary" onclick="loadSchedule()">🔄 Refresh</button>
      <button class="btn secondary" onclick="window.print()">🖨 Print Schedule</button>
    </div>

    <section id="scheduleContainer"><div class="loading">Loading schedule...</div></section>
  </main>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1nH3Jvm1XFFqA52Sj7I0Swll9DU5yUOqv0ddr21zWEgw/export?format=csv&gid=0";
    let schedule = [];

    const fallbackMapLinks = {
      "PSOEB": "https://www.google.com/maps/search/?api=1&query=PSOEB",
      "Sengkang": "https://www.google.com/maps/search/?api=1&query=Sengkang+Hockey+Pitch",
      "School": "https://www.google.com/maps/search/?api=1&query=St+Andrew's+Junior+College"
    };

    function escapeHtml(text){
      return String(text ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function parseCSV(text){
      const rows=[];
      let row=[];
      let cell="";
      let quote=false;

      for(let i=0;i<text.length;i++){
        const c=text[i];
        const n=text[i+1];

        if(c==='"' && quote && n==='"'){
          cell+='"';
          i++;
        } else if(c==='"'){
          quote=!quote;
        } else if(c===',' && !quote){
          row.push(cell.trim());
          cell="";
        } else if((c==='\n'||c==='\r') && !quote){
          if(cell || row.length){
            row.push(cell.trim());
            rows.push(row);
            row=[];
            cell="";
          }
          if(c==='\r' && n==='\n') i++;
        } else {
          cell+=c;
        }
      }

      if(cell || row.length){
        row.push(cell.trim());
        rows.push(row);
      }
      return rows;
    }

    function normaliseHeader(h){
      return String(h || "").toLowerCase().replace(/\s+/g,"");
    }

    function getSessionDate(item){
      if(item.dateISO && /^\d{4}-\d{2}-\d{2}$/.test(item.dateISO)) return new Date(item.dateISO + "T00:00:00");
      if(item.date && /^\d{4}-\d{2}-\d{2}$/.test(item.date)) return new Date(item.date + "T00:00:00");

      const monthMap={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
      const parts=String(item.date || "").split("-");

      if(parts.length>=2){
        const d=Number(parts[0]);
        const m=monthMap[String(parts[1]).slice(0,3).toLowerCase()];
        if(!isNaN(d) && m!==undefined) return new Date(2026,m,d);
      }
      return null;
    }

    function isTodayOrFuture(item){
      const d=getSessionDate(item);
      if(!d) return true;
      const today=new Date();
      today.setHours(0,0,0,0);
      d.setHours(0,0,0,0);
      return d>=today;
    }

    function makeSessionId(item){
      return `${item.dateISO || item.date}_${item.day || ""}_${item.start || ""}_${item.end || ""}_${item.venue || ""}`.replace(/[^a-zA-Z0-9_-]/g,"_");
    }

    function makeMapLink(item){
      return item.mapLink || fallbackMapLinks[item.venue] || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.venue || "")}`;
    }

    function makeCalendarLink(item){
      const d=getSessionDate(item);
      const date=d ? `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}` : "20260101";
      const start=`${date}T${item.start || "0000"}00`;
      const end=`${date}T${item.end || "0100"}00`;
      const title=encodeURIComponent(`Hockey ${item.remarks || "Training"}`);
      const location=encodeURIComponent(item.venue || "");
      const details=encodeURIComponent(`Coach: ${item.coach || "TBC"}\nTIC: ${item.tic || "TBC"}`);
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&location=${location}&details=${details}`;
    }

    async function loadSchedule(){
      const container=document.getElementById("scheduleContainer");
      container.innerHTML=`<div class="loading">Loading schedule...</div>`;

      try{
        const response=await fetch(SHEET_CSV_URL + "&cache=" + Date.now());
        if(!response.ok) throw new Error("Unable to fetch Google Sheet");

        const csvText=await response.text();
        const rows=parseCSV(csvText);

        if(!rows.length){
          throw new Error("CSV is empty");
        }

        const headers=rows[0].map(normaliseHeader);

        schedule=rows.slice(1)
          .filter(row=>row.some(cell=>String(cell).trim()!==""))
          .map(row=>{
            const obj={};
            headers.forEach((h,i)=>obj[h]=row[i] || "");
            return {
              term: obj.term || "2026 Schedule",
              date: obj.date || "",
              dateISO: obj.dateiso || "",
              day: obj.day || "",
              start: obj.starttime || obj.start || "",
              end: obj.endtime || obj.end || "",
              venue: obj.venue || "",
              remarks: obj.remarks || "Training",
              coach: obj.coach || "",
              tic: obj.tic || "",
              mapLink: obj.maplink || ""
            };
          })
          .filter(isTodayOrFuture)
          .sort((a,b)=>(getSessionDate(a)||new Date(9999,0,1))-(getSessionDate(b)||new Date(9999,0,1)));

        renderSchedule();
      } catch(err){
        console.error(err);
        container.innerHTML=`<div class="error">Unable to load Google Sheets schedule. Check that the sheet is published or shared properly.</div>`;
      }
    }

    function renderSchedule(){
      const searchValue=document.getElementById("searchInput").value.toLowerCase();
      const filtered=schedule.filter(item=>Object.values(item).join(" ").toLowerCase().includes(searchValue));

      const grouped=filtered.reduce((acc,item)=>{
        const term=item.term || "Schedule";
        if(!acc[term]) acc[term]=[];
        acc[term].push(item);
        return acc;
      },{});

      const container=document.getElementById("scheduleContainer");

      if(filtered.length===0){
        container.innerHTML=`<div class="empty">No upcoming sessions found.</div>`;
        return;
      }

      container.innerHTML=Object.keys(grouped).map(term=>`
        <h2 class="term-title">${escapeHtml(term)}</h2>
        <div class="schedule-grid">
          ${grouped[term].map(item=>`
            <article class="card">
              <div class="card-top">
                <div>
                  <div class="date">${escapeHtml(item.date || item.dateISO)}</div>
                  <span class="tag">${escapeHtml(item.start)}–${escapeHtml(item.end)}</span>
                </div>
                <div class="day">${escapeHtml(item.day)}</div>
              </div>
              <div class="info"><span>Venue</span><span>${escapeHtml(item.venue)}</span></div>
              <div class="info"><span>Remarks</span><span>${escapeHtml(item.remarks || "Training")}</span></div>
              <div class="info"><span>Coach</span><span>${escapeHtml(item.coach || "TBC")}</span></div>
              <div class="info"><span>TIC</span><span>${escapeHtml(item.tic || "TBC")}</span></div>
              
              <div class="card-actions">
                <a class="small-btn" href="${makeMapLink(item)}" target="_blank">📍 Map</a>
                <a class="small-btn" href="${makeCalendarLink(item)}" target="_blank">📅 Add</a>
                <a class="small-btn" href="attendance.html?session=${encodeURIComponent(makeSessionId(item))}">✅ Attendance</a>
              </div>
            </article>
          `).join("")}
        </div>
      `).join("");
    }

    document.getElementById("searchInput").addEventListener("input",renderSchedule);
    window.loadSchedule=loadSchedule;
    loadSchedule();
  </script>
</body>
</html>
