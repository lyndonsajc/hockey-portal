<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hockey Team Schedule</title>
  <style>
    :root {
      --blue: #123c69;
      --blue2: #1f5f99;
      --light-blue: #e8f1fb;
      --gold: #f6c453;
      --dark: #1f2937;
      --border: #d1d5db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: var(--dark);
    }

    header {
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: white;
      padding: 32px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 16px;
      opacity: 0.95;
    }

    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .notice {
      background: #fff7df;
      border-left: 5px solid var(--gold);
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .toolbar {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    label {
      font-size: 12px;
      font-weight: bold;
      color: #4b5563;
      display: block;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      background: white;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--blue);
      color: white;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .btn.secondary {
      background: white;
      color: var(--blue);
      border: 1px solid var(--border);
    }

    .term-title {
      margin: 30px 0 12px;
      font-size: 28px;
      color: var(--blue);
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
