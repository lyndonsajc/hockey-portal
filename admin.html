<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saints Hockey Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;font-family:Outfit,Arial,sans-serif;background:linear-gradient(180deg,#07111f,#050b14);color:#eef5ff;min-height:100vh}
header{padding:18px 16px;background:#07111f;border-bottom:1px solid #25324a}
.wrap{max-width:900px;margin:0 auto}
h1{margin:0;font-size:30px} .tag{color:#f6c453;font-weight:800;margin-top:5px}
.panel{max-width:900px;margin:18px auto;padding:16px;border:1px solid #25324a;border-radius:22px;background:#0e1728}
label{display:block;margin:12px 0 6px;color:#b9c8dc;font-weight:800;font-size:12px}
input,textarea{width:100%;padding:13px;border-radius:14px;border:1px solid #25324a;background:#070e1c;color:#eef5ff;font:inherit}
textarea{min-height:100px}
button,a{display:inline-block;margin:10px 8px 0 0;padding:11px 14px;border-radius:14px;border:1px solid #25324a;background:#132641;color:#eef5ff;text-decoration:none;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(135deg,#14b8a6,#22c55e);color:#04111d;border:0}
.danger{background:rgba(251,113,133,.16);color:#fecdd3;border-color:rgba(251,113,133,.4)}
.hidden{display:none}
.item{padding:12px;margin:10px 0;border:1px solid #25324a;border-radius:16px;background:#0b1526}
.date{color:#b9c8dc;font-size:12px;font-weight:800;margin-bottom:5px}
.status{color:#b9c8dc;margin-top:8px}

.table-wrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid #25324a;padding:8px;text-align:left;white-space:nowrap}
th{color:#b9c8dc;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.count-pill{display:inline-block;margin:6px 8px 0 0;padding:6px 10px;border-radius:999px;background:#0b1526;border:1px solid #25324a;color:#dbeafe;font-weight:800;font-size:12px}


select{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:1px solid #25324a;
  background:#070e1c;
  color:#eef5ff;
  font:inherit;
}
.attendance-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.attendance-status{min-width:140px}
.reason-box{min-width:180px}
@media(max-width:760px){
  .attendance-controls{grid-template-columns:1fr}
}

</style>
</head>
<body>
<header><div class="wrap"><h1>Saints Hockey Admin</h1><div class="tag">Pride. Passion. Perseverance.</div></div></header>

<section id="loginPanel" class="panel">
<h2>Admin Login</h2>

<label>Email</label><input id="email" type="email">
<label>Password</label><input id="password" type="password">
<button class="primary" onclick="login()">Login</button><a href="index.html">Back to Schedule</a>
<div id="loginStatus" class="status"></div>
</section>

<section id="adminPanel" class="panel hidden">
<h2>Add Announcement</h2>
<label>Date / Label</label><input id="announcementDate" placeholder="e.g. 3 Jul 2026">
<label>Announcement</label><textarea id="announcementText"></textarea>
<button class="primary" onclick="addAnnouncement()">Add Announcement</button>
<button onclick="clearAnnouncementForm()">Clear</button>
<button class="danger" onclick="logout()">Logout</button>
<a href="index.html">Back to Schedule</a>
<div id="adminStatus" class="status"></div>
</section>

<section id="listPanel" class="panel hidden">
<h2>Existing Announcements</h2>
<div id="announcementList">Loading...</div>
</section>


<section id="attendancePanel" class="panel hidden">
<h2>Attendance Management</h2>

<div class="attendance-controls">
  <div>
    <label>Session</label>
    <select id="attendanceSessionSelect">
      <option value="">Loading sessions...</option>
    </select>
  </div>
  <div>
    <label>Search Student / Class</label>
    <input id="attendanceSearch" placeholder="Type name or class" oninput="renderAttendanceEditor()">
  </div>
</div>

<button class="primary" onclick="loadSelectedAttendance()">Load Attendance</button>
<button onclick="downloadAttendanceCsv()">Download CSV</button>

<div id="attendanceStatus" class="status"></div>
<div id="attendanceSummary"></div>

<div class="table-wrap">
  <table id="attendanceTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Class</th>
        <th>Group</th>
        <th>Status</th>
        <th>Reason</th>
        <th>Save</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="6">Choose a session and click Load Attendance.</td></tr>
    </tbody>
  </table>
</div>
</section>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, setDoc, onSnapshot, serverTimestamp, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBTKW9nlCQK-1ktvEu8at4-KRLjIwbz660",
    authDomain: "saintshockeyattendance.firebaseapp.com",
    projectId: "saintshockeyattendance",
    storageBucket: "saintshockeyattendance.firebasestorage.app",
    messagingSenderId: "717790587080",
    appId: "1:717790587080:web:cd9e1a07d580566f3f1dfd"
  };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
let unsub = null;
const SCHEDULE_CSV_URL = "https://docs.google.com/spreadsheets/d/1-r7uyrReT36YhEF6xzx5YpnFG6Z-ycPp3XzfAaWUSP8/export?format=csv&gid=0";
const STUDENT_CSV_URL = "https://docs.google.com/spreadsheets/d/1-r7uyrReT36YhEF6xzx5YpnFG6Z-ycPp3XzfAaWUSP8/export?format=csv&gid=1879195237";
let attendanceSessions = [];
let attendanceStudents = [];
let selectedAttendanceSession = null;

function esc(t){return String(t??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function status(id,msg){document.getElementById(id).textContent=msg||""}

async function login(){
  try{
    status("loginStatus","Logging in...");
    await signInWithEmailAndPassword(auth, document.getElementById("email").value.trim(), document.getElementById("password").value);
    status("loginStatus","");
  }catch(e){console.error(e);status("loginStatus","Login failed. Check email/password.")}
}
async function logout(){await signOut(auth)}

function loadAnnouncements(){
  const box=document.getElementById("announcementList");
  if(unsub) unsub();
  unsub=onSnapshot(collection(db,"announcements"), snap=>{
    if(snap.empty){box.innerHTML='<div class="item">No announcements yet.</div>';return}
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0)));
    box.innerHTML=docs.map(x=>`<div class="item"><div class="date">${esc(x.date||"Announcement")}</div><div>${esc(x.text||"")}</div><button class="danger" onclick="deleteAnnouncement('${x.id}')">Delete</button></div>`).join("");
  }, e=>{console.error(e);box.innerHTML='<div class="item">Unable to load announcements. Check Firebase rules.</div>'});
}
async function addAnnouncement(){
  const date=document.getElementById("announcementDate").value.trim();
  const text=document.getElementById("announcementText").value.trim();
  if(!text){status("adminStatus","Please type an announcement.");return}
  try{
    await addDoc(collection(db,"announcements"), {date:date||"Announcement", text, createdAt:serverTimestamp()});
    clearAnnouncementForm(); status("adminStatus","Announcement added.");
  }catch(e){console.error(e);status("adminStatus","Unable to add. Check login/rules.")}
}
async function deleteAnnouncement(id){
  if(!confirm("Delete this announcement?")) return;
  try{await deleteDoc(doc(db,"announcements",id));status("adminStatus","Announcement deleted.")}
  catch(e){console.error(e);status("adminStatus","Unable to delete. Check login/rules.")}
}
function clearAnnouncementForm(){document.getElementById("announcementDate").value="";document.getElementById("announcementText").value=""}


function normaliseHeader(header){return String(header||"").toLowerCase().replace(/\s+/g,"")}
function safeId(text){return String(text??"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}

function csvToRows(text){
  const rows=[];let row=[],cell="",insideQuotes=false;
  for(let i=0;i<text.length;i++){
    const char=text[i], next=text[i+1];
    if(char==='"'&&insideQuotes&&next==='"'){cell+='"';i++}
    else if(char==='"'){insideQuotes=!insideQuotes}
    else if(char===','&&!insideQuotes){row.push(cell.trim());cell=""}
    else if((char==='\n'||char==='\r')&&!insideQuotes){
      if(cell||row.length){row.push(cell.trim());rows.push(row);row=[];cell=""}
      if(char==='\r'&&next==='\n')i++;
    } else {cell+=char}
  }
  if(cell||row.length){row.push(cell.trim());rows.push(row)}
  return rows;
}

function rowsToScheduleObjects(rows){
  if(!rows.length)return[];
  const headers=rows[0].map(normaliseHeader);
  return rows.slice(1).filter(row=>row.some(cell=>String(cell).trim()!=="")).map(row=>{
    const obj={};headers.forEach((header,index)=>obj[header]=row[index]||"");
    const item={
      term:obj.term||"",
      date:obj.date||"",
      day:obj.day||"",
      start:obj.start||obj.starttime||"",
      end:obj.end||obj.endtime||"",
      venue:obj.venue||"",
      remarks:obj.remarks||"Training",
      coach:obj.coach||"",
      tic:obj.tic||""
    };
    item.id=safeId(`${item.date}-${item.day}-${item.start}-${item.end}-${item.venue}-${item.remarks}`);
    item.label=`${item.date} ${item.day} ${item.start}-${item.end} ${item.venue} (${item.remarks})`;
    return item;
  }).filter(item=>item.date);
}

function rowsToStudentObjects(rows){
  if(!rows.length)return[];
  const headers=rows[0].map(normaliseHeader);
  return rows.slice(1).filter(row=>row.some(cell=>String(cell).trim()!=="")).map((row,index)=>{
    const obj={};headers.forEach((header,i)=>obj[header]=row[i]||"");
    const name=obj.studentname||obj.name||"";
    const className=obj.class||obj.classname||"";
    const gender=(obj.mf||obj["m/f"]||obj.gender||obj.sex||"").trim().toUpperCase();
    const group=gender==="M"?"Boys":gender==="F"?"Girls":"";
    return {id:String(index+1).padStart(2,"0"),name,className,gender,group};
  }).filter(s=>s.name);
}

async function fetchCsv(url){
  const response=await fetch(url+"&cachebust="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw new Error("Unable to load CSV");
  return response.text();
}

async function loadAttendanceSetup(){
  const sessionSelect=document.getElementById("attendanceSessionSelect");
  if(!sessionSelect)return;
  try{
    sessionSelect.innerHTML='<option value="">Loading sessions...</option>';
    const [scheduleCsv, studentCsv]=await Promise.all([fetchCsv(SCHEDULE_CSV_URL), fetchCsv(STUDENT_CSV_URL)]);
    attendanceSessions=rowsToScheduleObjects(csvToRows(scheduleCsv));
    attendanceStudents=rowsToStudentObjects(csvToRows(studentCsv));
    sessionSelect.innerHTML=attendanceSessions.length
      ? attendanceSessions.map(s=>`<option value="${s.id}">${esc(s.label)}</option>`).join("")
      : '<option value="">No sessions found</option>';
    status("attendanceStatus", `Loaded ${attendanceSessions.length} sessions and ${attendanceStudents.length} students.`);
  }catch(e){
    console.error(e);
    status("attendanceStatus","Unable to load sessions/students from Google Sheets.");
  }
}

async function loadSelectedAttendance(){
  const sessionId=document.getElementById("attendanceSessionSelect").value;
  selectedAttendanceSession=attendanceSessions.find(s=>s.id===sessionId)||null;
  if(!selectedAttendanceSession){
    status("attendanceStatus","Choose a session first.");
    return;
  }

  try{
    status("attendanceStatus","Loading attendance records...");
    const snap=await getDocs(collection(db,"attendance",sessionId,"records"));
    const records={};
    snap.docs.forEach(d=>records[d.id]=d.data());

    loadedAttendanceRows=attendanceStudents.map(student=>{
      const record=records[student.id]||{};
      return {
        studentId:student.id,
        name:student.name,
        className:student.className,
        group:student.group,
        gender:student.gender,
        status:record.status||"Unmarked",
        reason:record.reason||"",
        sessionId:selectedAttendanceSession.id,
        sessionLabel:selectedAttendanceSession.label,
        date:selectedAttendanceSession.date,
        day:selectedAttendanceSession.day,
        start:selectedAttendanceSession.start,
        end:selectedAttendanceSession.end,
        venue:selectedAttendanceSession.venue,
        remarks:selectedAttendanceSession.remarks,
        updatedAt:record.updatedAt||""
      };
    });

    renderAttendanceEditor();
    status("attendanceStatus",`Loaded attendance for ${selectedAttendanceSession.label}.`);
  }catch(e){
    console.error(e);
    status("attendanceStatus","Unable to load attendance. Check Firebase rules.");
  }
}

function renderAttendanceEditor(){
  const tbody=document.querySelector("#attendanceTable tbody");
  const summary=document.getElementById("attendanceSummary");
  if(!tbody)return;

  const search=(document.getElementById("attendanceSearch")?.value||"").toLowerCase();
  const filtered=loadedAttendanceRows.filter(r=>
    r.name.toLowerCase().includes(search) ||
    r.className.toLowerCase().includes(search) ||
    r.group.toLowerCase().includes(search)
  );

  const present=loadedAttendanceRows.filter(r=>r.status==="Present").length;
  const absent=loadedAttendanceRows.filter(r=>r.status==="Absent").length;
  const mc=loadedAttendanceRows.filter(r=>r.status==="MC/Parent Letter").length;
  const unmarked=loadedAttendanceRows.filter(r=>!["Present","Absent","MC/Parent Letter"].includes(r.status)).length;

  summary.innerHTML=`
    <span class="count-pill">Total: ${loadedAttendanceRows.length}</span>
    <span class="count-pill">Present: ${present}</span>
    <span class="count-pill">Absent: ${absent}</span>
    <span class="count-pill">MC/PL: ${mc}</span>
    <span class="count-pill">Unmarked: ${unmarked}</span>
  `;

  if(!filtered.length){
    tbody.innerHTML='<tr><td colspan="6">No matching students.</td></tr>';
    return;
  }

  tbody.innerHTML=filtered.map(r=>`
    <tr>
      <td>${esc(r.name)}</td>
      <td>${esc(r.className)}</td>
      <td>${esc(r.group)}</td>
      <td>
        <select class="attendance-status" id="status-${r.studentId}">
          <option value="Unmarked" ${r.status==="Unmarked"?"selected":""}>Unmarked</option>
          <option value="Present" ${r.status==="Present"?"selected":""}>Present</option>
          <option value="Absent" ${r.status==="Absent"?"selected":""}>Absent</option>
          <option value="MC/Parent Letter" ${r.status==="MC/Parent Letter"?"selected":""}>MC/PL</option>
        </select>
      </td>
      <td><input class="reason-box" id="reason-${r.studentId}" value="${esc(r.reason)}" placeholder="Reason"></td>
      <td><button class="primary" onclick="saveAttendanceRecord('${r.studentId}')">Save</button></td>
    </tr>
  `).join("");
}

async function saveAttendanceRecord(studentId){
  if(!selectedAttendanceSession){
    status("attendanceStatus","Load a session first.");
    return;
  }

  const row=loadedAttendanceRows.find(r=>r.studentId===studentId);
  if(!row){
    status("attendanceStatus","Student record not found.");
    return;
  }

  const newStatus=document.getElementById(`status-${studentId}`).value;
  const newReason=document.getElementById(`reason-${studentId}`).value.trim();
  const now=new Date().toISOString();

  const attendancePayload={
    studentId,
    name:row.name,
    className:row.className,
    group:row.group,
    gender:row.gender,
    status:newStatus,
    reason:newReason,
    sessionId:selectedAttendanceSession.id,
    sessionLabel:selectedAttendanceSession.label,
    updatedAt:now,
    timestamp:serverTimestamp()
  };

  const teacherPayload={
    sessionId:selectedAttendanceSession.id,
    sessionLabel:selectedAttendanceSession.label,
    date:selectedAttendanceSession.date||"",
    day:selectedAttendanceSession.day||"",
    start:selectedAttendanceSession.start||"",
    end:selectedAttendanceSession.end||"",
    venue:selectedAttendanceSession.venue||"",
    remarks:selectedAttendanceSession.remarks||"",
    studentId,
    name:row.name,
    className:row.className,
    group:row.group,
    gender:row.gender,
    status:newStatus,
    reason:newReason,
    updatedAt:now,
    timestamp:serverTimestamp()
  };

  try{
    await setDoc(doc(db,"attendance",selectedAttendanceSession.id,"records",studentId),attendancePayload,{merge:true});
    await setDoc(doc(db,"teacherAttendanceRecords",`${selectedAttendanceSession.id}_${studentId}`),teacherPayload,{merge:true});
    row.status=newStatus;
    row.reason=newReason;
    row.updatedAt=now;
    renderAttendanceEditor();
    status("attendanceStatus",`Saved ${row.name}.`);
  }catch(e){
    console.error(e);
    status("attendanceStatus","Unable to save attendance. Check Firebase rules/admin login.");
  }
}



let loadedAttendanceRows = [];

function normaliseDateValue(dateText){
  if(!dateText) return "";
  const monthMap={jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",jul:"07",aug:"08",sep:"09",oct:"10",nov:"11",dec:"12"};
  const clean=String(dateText).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(clean)) return clean;
  const parts=clean.split("-");
  if(parts.length>=2){
    const day=String(Number(parts[0])).padStart(2,"0");
    const month=monthMap[String(parts[1]).slice(0,3).toLowerCase()];
    if(month) return `2026-${month}-${day}`;
  }
  const parsed=new Date(clean);
  if(!isNaN(parsed.getTime())){
    return `${parsed.getFullYear()}-${String(parsed.getMonth()+1).padStart(2,"0")}-${String(parsed.getDate()).padStart(2,"0")}`;
  }
  return "";
}

async function loadAttendanceAfterDate(){
  const fromDate=document.getElementById("attendanceFromDate").value;
  const tbody=document.querySelector("#attendanceTable tbody");
  const summary=document.getElementById("attendanceSummary");
  loadedAttendanceRows=[];
  summary.innerHTML="";
  if(!fromDate){
    document.getElementById("attendanceStatus").textContent="Choose a date first.";
    return;
  }

  try{
    document.getElementById("attendanceStatus").textContent="Loading attendance...";
    tbody.innerHTML='<tr><td colspan="8">Loading...</td></tr>';

    const snap=await getDocs(query(collection(db,"teacherAttendanceRecords"), orderBy("updatedAt","desc")));
    loadedAttendanceRows=snap.docs
      .map(d=>({id:d.id,...d.data()}))
      .map(r=>({...r, normalisedDate: normaliseDateValue(r.date)}))
      .filter(r=>r.normalisedDate && r.normalisedDate>=fromDate)
      .sort((a,b)=>(a.normalisedDate||"").localeCompare(b.normalisedDate||"") || (a.sessionLabel||"").localeCompare(b.sessionLabel||"") || (a.name||"").localeCompare(b.name||""));

    if(!loadedAttendanceRows.length){
      tbody.innerHTML='<tr><td colspan="8">No attendance records found from this date.</td></tr>';
      document.getElementById("attendanceStatus").textContent="No records found.";
      return;
    }

    const present=loadedAttendanceRows.filter(r=>r.status==="Present").length;
    const absent=loadedAttendanceRows.filter(r=>r.status==="Absent").length;
    const mc=loadedAttendanceRows.filter(r=>r.status==="MC/Parent Letter").length;

    summary.innerHTML=`
      <span class="count-pill">Total: ${loadedAttendanceRows.length}</span>
      <span class="count-pill">Present: ${present}</span>
      <span class="count-pill">Absent: ${absent}</span>
      <span class="count-pill">MC/PL: ${mc}</span>
    `;

    tbody.innerHTML=loadedAttendanceRows.map(r=>`
      <tr>
        <td>${esc(r.date||"")}</td>
        <td>${esc(r.sessionLabel||"")}</td>
        <td>${esc(r.name||"")}</td>
        <td>${esc(r.className||"")}</td>
        <td>${esc(r.group||"")}</td>
        <td>${esc(r.status||"")}</td>
        <td>${esc(r.reason||"")}</td>
        <td>${esc(r.updatedAt||"")}</td>
      </tr>
    `).join("");

    document.getElementById("attendanceStatus").textContent=`Loaded ${loadedAttendanceRows.length} records.`;
  }catch(e){
    console.error(e);
    tbody.innerHTML='<tr><td colspan="8">Unable to load attendance. Check Firebase login/rules.</td></tr>';
    document.getElementById("attendanceStatus").textContent="Unable to load attendance.";
  }
}

function downloadAttendanceCsv(){
  if(!loadedAttendanceRows.length){
    document.getElementById("attendanceStatus").textContent="Load attendance first.";
    return;
  }

  const rows=[["Date","Session","Name","Class","Group","Status","Reason","Updated At"]];
  loadedAttendanceRows.forEach(r=>rows.push([
    r.date||"",r.sessionLabel||"",r.name||"",r.className||"",r.group||"",r.status||"",r.reason||"",r.updatedAt||""
  ]));

  const csv=rows.map(row=>row.map(cell=>`"${String(cell).replaceAll('"','""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`attendance_from_${document.getElementById("attendanceFromDate").value||"selected_date"}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}


onAuthStateChanged(auth, user=>{
  document.getElementById("loginPanel").classList.toggle("hidden", !!user);
  document.getElementById("adminPanel").classList.toggle("hidden", !user);
  document.getElementById("listPanel").classList.toggle("hidden", !user);
  document.getElementById("attendancePanel").classList.toggle("hidden", !user);
  if(user){ loadAnnouncements(); loadAttendanceSetup(); } else if(unsub){unsub();unsub=null}
});

window.login=login; window.logout=logout; window.addAnnouncement=addAnnouncement; window.deleteAnnouncement=deleteAnnouncement; window.clearAnnouncementForm=clearAnnouncementForm; window.loadAttendanceAfterDate=loadAttendanceAfterDate; window.downloadAttendanceCsv=downloadAttendanceCsv; window.loadAttendanceSetup=loadAttendanceSetup; window.loadSelectedAttendance=loadSelectedAttendance; window.renderAttendanceEditor=renderAttendanceEditor; window.saveAttendanceRecord=saveAttendanceRecord;
</script>
</body>
</html>
