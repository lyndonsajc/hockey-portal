<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hockey Attendance Dashboard</title>
  <style>
    :root{--blue:#123c69;--blue2:#1f5f99;--green:#15803d;--green-bg:#dcfce7;--red:#b91c1c;--red-bg:#fee2e2;--purple:#6d28d9;--purple-bg:#ede9fe;--border:#d1d5db;--dark:#1f2937}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;color:var(--dark)}header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;padding:16px 12px;text-align:center}header h1{margin:0;font-size:23px}.container{max-width:1050px;margin:10px auto;padding:0 8px 24px}.panel{background:white;border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:0 4px 12px rgba(0,0,0,.04);margin-bottom:10px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1.3fr;gap:8px}label{display:block;font-size:11px;font-weight:bold;color:#4b5563;margin-bottom:4px}input,select{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:white}.mode-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.mode-btn,.main-btn{border:1px solid var(--border);border-radius:999px;padding:7px 10px;font-weight:bold;cursor:pointer;background:white;color:var(--blue);font-size:12px;text-decoration:none;display:inline-block}.mode-btn.active,.main-btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.team-summary{border-radius:12px;padding:9px;border:1px solid var(--border);background:white}.team-summary-title{font-weight:bold;color:var(--blue);font-size:15px;margin-bottom:6px}.team-summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mini-stat{border-radius:10px;padding:8px;text-align:center;border:1px solid var(--border)}.mini-stat .number{font-size:22px;font-weight:bold;margin-bottom:2px}.mini-stat .label{font-size:11px;font-weight:bold;color:#4b5563}.present{background:var(--green-bg);color:var(--green)}.absent{background:var(--red-bg);color:var(--red)}.mc{background:var(--purple-bg);color:var(--purple)}.student-panel{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.04)}.student-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:white;background:var(--blue);font-weight:bold;font-size:16px}.student-total{background:white;color:var(--blue);border-radius:999px;padding:4px 8px;font-size:12px}.student-list{padding:8px}.student-card{border:1px solid #e5e7eb;border-radius:10px;padding:8px;margin-bottom:7px}.student-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:7px}.name{font-size:15px;font-weight:bold;color:var(--blue)}.meta{margin-top:2px;color:#6b7280;font-size:12px}.status-pill{border-radius:999px;padding:4px 7px;font-size:11px;font-weight:bold;background:#f3f4f6;color:#374151;white-space:nowrap}.button-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.att-btn{border:none;border-radius:8px;padding:8px 4px;font-size:12px;font-weight:bold;cursor:pointer}.att-btn.present{background:var(--green-bg);color:var(--green)}.att-btn.absent{background:var(--red-bg);color:var(--red)}.att-btn.mc{background:var(--purple-bg);color:var(--purple)}.details-grid{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:7px;align-items:center}.reason-input{padding:8px;border:1px solid var(--border);border-radius:8px;font-size:12px}.timestamp{margin-top:5px;font-size:11px;color:#6b7280}.loading,.empty,.error{background:white;border:1px dashed var(--border);border-radius:12px;padding:14px;text-align:center;color:#6b7280}.error{border-color:#fca5a5;color:#991b1b;background:#fff5f5}.footer-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}@media(max-width:760px){header{padding:12px 8px}header h1{font-size:20px}.container{margin:8px auto}.controls{grid-template-columns:1fr 1fr}.summary-grid{grid-template-columns:1fr}.button-grid{grid-template-columns:repeat(3,1fr)}.details-grid{grid-template-columns:1fr}.mode-btn,.main-btn{font-size:11px;padding:7px 9px}.student-card{padding:7px}.att-btn{font-size:11px;padding:8px 3px}}
  </style>
</head>
<body>
<header><h1>Hockey Attendance Dashboard</h1></header>
<main class="container">
  <section class="panel">
    <div class="controls">
      <div><label for="sessionDate">Session Date</label><input id="sessionDate" type="date" /></div>
      <div><label for="sessionName">Session</label><select id="sessionName"><option>Wednesday Training</option><option>Friday Training</option><option>Match Day</option><option>Fitness Session</option><option>Other</option></select></div>
      <div><label for="groupFilter">Group</label><select id="groupFilter"><option value="all">All Groups</option></select></div>
      <div><label for="searchInput">Search Student</label><input id="searchInput" type="text" placeholder="Type name or class..." /></div>
    </div>
    <div class="mode-row">
      <button class="mode-btn active">✅ Attendance Taking</button>
      <button class="mode-btn" onclick="loadStudents()">🔄 Refresh Name List</button>
    </div>
  </section>

  <section class="panel">
    <div class="summary-grid">
      <div class="team-summary">
        <div class="team-summary-title">👦 Boys</div>
        <div class="team-summary-row">
          <div class="mini-stat"><div id="boysTotalCount" class="number">0</div><div class="label">Total</div></div>
          <div class="mini-stat present"><div id="boysPresentCount" class="number">0</div><div class="label">Present</div></div>
          <div class="mini-stat absent"><div id="boysAbsentCount" class="number">0</div><div class="label">Absent</div></div>
          <div class="mini-stat mc"><div id="boysMcCount" class="number">0</div><div class="label">MC/PL</div></div>
        </div>
      </div>
      <div class="team-summary">
        <div class="team-summary-title">👧 Girls</div>
        <div class="team-summary-row">
          <div class="mini-stat"><div id="girlsTotalCount" class="number">0</div><div class="label">Total</div></div>
          <div class="mini-stat present"><div id="girlsPresentCount" class="number">0</div><div class="label">Present</div></div>
          <div class="mini-stat absent"><div id="girlsAbsentCount" class="number">0</div><div class="label">Absent</div></div>
          <div class="mini-stat mc"><div id="girlsMcCount" class="number">0</div><div class="label">MC/PL</div></div>
        </div>
      </div>
    </div>
  </section>

  <section class="student-panel">
    <div class="student-header">🏑 Attendance List <span id="studentTotalPill" class="student-total">Total: 0</span></div>
    <div id="studentContainer" class="student-list"><div class="loading">Loading attendance list...</div></div>
  </section>

  <div class="footer-actions"><button class="main-btn primary" onclick="downloadCsv()">⬇ Download Today’s CSV</button><button class="main-btn" onclick="clearLocalAttendance()">🧹 Clear Local Marks</button></div>
</main>

<script>
const STUDENT_LIST_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSSiEUswn59-Ve2NxTmLH9ZtB-OrAGqHNwsjDxl-TDLnlykGFmD7ASZvEY1y-QVMVG36icMUCHf8COf/pub?output=csv";
const GOOGLE_APPS_SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxjLPiMwaQzu0SE6YizsKX1LFgG_3RhBsLGpvDtfkMQlVVGWmmtTojR3h4GsCSN5dCMcA/exec";
const MC_PARENT_LETTER_UPLOAD_LINK = "https://docs.google.com/forms/d/e/1FAIpQLSeWelhY6SsCrPo2g-GGByH33dAS0hx26AygKzQrtOgqWbay3A/viewform?usp=header";

let students = [];
let attendance = {};

function todayIsoDate(){const now=new Date();const offset=now.getTimezoneOffset();const local=new Date(now.getTime()-offset*60000);return local.toISOString().slice(0,10)}
document.getElementById("sessionDate").value=todayIsoDate();

function csvToRows(text){const rows=[];let row=[],cell="",insideQuotes=false;for(let i=0;i<text.length;i++){const char=text[i],next=text[i+1];if(char==='"'&&insideQuotes&&next==='"'){cell+='"';i++}else if(char==='"'){insideQuotes=!insideQuotes}else if(char===','&&!insideQuotes){row.push(cell.trim());cell=""}else if((char==='\n'||char==='\r')&&!insideQuotes){if(cell||row.length){row.push(cell.trim());rows.push(row);row=[];cell=""}if(char==='\r'&&next==='\n')i++}else{cell+=char}}if(cell||row.length){row.push(cell.trim());rows.push(row)}return rows}
function normaliseHeader(header){return header.toLowerCase().replace(/\s+/g,"")}
function rowsToStudentObjects(rows){if(!rows.length)return[];const headers=rows[0].map(normaliseHeader);return rows.slice(1).filter(row=>row.some(cell=>cell.trim()!=="")).map(row=>{const obj={};headers.forEach((header,index)=>obj[header]=row[index]||"");return{name:obj.name||obj.studentname||"",className:obj.class||obj.classname||"",group:obj.group||obj.team||"",jersey:obj.jersey||obj.jerseyno||"",gender:obj.gender||obj.sex||""}}).filter(student=>student.name)}
function escapeHtml(text){return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function getSessionKey(){return `${document.getElementById("sessionDate").value}_${document.getElementById("sessionName").value}`}
function getStudentKey(student){return `${student.name}_${student.className}_${student.group}`}
function loadLocalAttendance(){const saved=localStorage.getItem("hockeyAttendance_"+getSessionKey());attendance=saved?JSON.parse(saved):{}}
function saveLocalAttendance(){localStorage.setItem("hockeyAttendance_"+getSessionKey(),JSON.stringify(attendance))}

async function loadStudents(){
  const studentContainer=document.getElementById("studentContainer");
  studentContainer.innerHTML='<div class="loading">Loading attendance list...</div>';
  try{
    const response=await fetch(STUDENT_LIST_CSV_URL+"&cachebust="+Date.now());
    if(!response.ok)throw new Error("Could not load student list");
    const csvText=await response.text();
    students=rowsToStudentObjects(csvToRows(csvText));
    loadLocalAttendance();
    updateGroupFilter();
    renderStudents();
    updateSummary();
  }catch(error){
    studentContainer.innerHTML='<div class="error">Unable to load students. Check that your Students sheet is published as CSV.</div>';
  }
}

function updateGroupFilter(){const select=document.getElementById("groupFilter");const current=select.value;const groups=[...new Set(students.map(s=>s.group).filter(Boolean))].sort();select.innerHTML='<option value="all">All Groups</option>'+groups.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join("");if([...select.options].some(o=>o.value===current))select.value=current}
function filteredStudents(){const groupValue=document.getElementById("groupFilter").value;const searchValue=document.getElementById("searchInput").value.toLowerCase();return students.filter(student=>{const text=`${student.name} ${student.className} ${student.group} ${student.jersey} ${student.gender}`.toLowerCase();return(groupValue==="all"||student.group===groupValue)&&text.includes(searchValue)})}
function cardHtml(student){const index=students.indexOf(student);const record=attendance[getStudentKey(student)];const status=record?record.status:"Unmarked";const reason=record?record.reason:"";const timestamp=record?record.timestamp:"";const statusClass=status.toLowerCase();return `<article class="student-card"><div class="student-top"><div><div class="name">${escapeHtml(student.name)}</div><div class="meta">${escapeHtml(student.className||"No class")} ${student.group?"• "+escapeHtml(student.group):""} ${student.jersey?"• #"+escapeHtml(student.jersey):""}</div></div><div class="status-pill ${statusClass}">${escapeHtml(status)}</div></div><div class="button-grid"><button class="att-btn present" onclick="markAttendance(${index}, 'Present')">✅ Present</button><button class="att-btn absent" onclick="markAttendance(${index}, 'Absent')">❌ Absent</button><button class="att-btn mc" onclick="markAttendance(${index}, 'MC/Parent Letter')">📄 MC/Parent's Letter</button></div><div class="details-grid"><input class="reason-input" id="reason-${index}" value="${escapeHtml(reason)}" placeholder="Reason for absence" onchange="saveReason(${index}, this.value)" /><a class="main-btn" href="${MC_PARENT_LETTER_UPLOAD_LINK}" target="_blank">Upload</a></div><div class="timestamp">${timestamp?"Last marked: "+escapeHtml(timestamp):"Not marked yet"}</div></article>`}
function renderStudents(){const filtered=filteredStudents();document.getElementById("studentContainer").innerHTML=filtered.length?filtered.map(cardHtml).join(""):'<div class="empty">No students found.</div>';document.getElementById("studentTotalPill").textContent=`Total: ${filtered.length}`;updateSummary()}
function updateSummary(){const boys=students.filter(s=>(`${s.group} ${s.gender}`).toLowerCase().includes('boy')||(`${s.group} ${s.gender}`).toLowerCase().includes('male'));const girls=students.filter(s=>(`${s.group} ${s.gender}`).toLowerCase().includes('girl')||(`${s.group} ${s.gender}`).toLowerCase().includes('female'));const records=Object.values(attendance);document.getElementById("boysTotalCount").textContent=boys.length;document.getElementById("girlsTotalCount").textContent=girls.length;document.getElementById("boysPresentCount").textContent=records.filter(r=>r.status==="Present"&&((`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('boy')||(`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('male'))).length;document.getElementById("girlsPresentCount").textContent=records.filter(r=>r.status==="Present"&&((`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('girl')||(`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('female'))).length;document.getElementById("boysAbsentCount").textContent=records.filter(r=>r.status==="Absent"&&((`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('boy')||(`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('male'))).length;document.getElementById("girlsAbsentCount").textContent=records.filter(r=>r.status==="Absent"&&((`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('girl')||(`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('female'))).length;document.getElementById("boysMcCount").textContent=records.filter(r=>r.status==="MC/Parent Letter"&&((`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('boy')||(`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('male'))).length;document.getElementById("girlsMcCount").textContent=records.filter(r=>r.status==="MC/Parent Letter"&&((`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('girl')||(`${r.student.group} ${r.student.gender||''}`).toLowerCase().includes('female'))).length}
function saveReason(studentIndex,reason){const student=students[studentIndex];const key=getStudentKey(student);const existing=attendance[key]||{status:"Unmarked",timestamp:"",mode:"Teacher",student};attendance[key]={...existing,reason};saveLocalAttendance();submitSessionToGoogleSheet();}
function markAttendance(studentIndex,status,mode="Teacher"){const student=students[studentIndex];const key=getStudentKey(student);const reasonInput=document.getElementById(`reason-${studentIndex}`);const reason=reasonInput?reasonInput.value:"";const timestamp=new Date().toLocaleString("en-SG",{hour12:false});attendance[key]={status,timestamp,mode,student,reason};saveLocalAttendance();renderStudents();submitSessionToGoogleSheet()}
async function submitSessionToGoogleSheet(){const timestamp=new Date().toLocaleString("en-SG",{hour12:false});const records=students.map(student=>{const record=attendance[getStudentKey(student)]||{};return{name:student.name,className:student.className,group:student.group,status:record.status||"",reason:record.reason||""}});const payload={type:"sessionSummary",timestamp,date:document.getElementById("sessionDate").value,session:document.getElementById("sessionName").value,records};try{await fetch(GOOGLE_APPS_SCRIPT_WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})}catch(error){console.log("Could not submit to Google Sheet",error)}}
function downloadCsv(){const rows=[["Date","Session","Name","Class","Group","Status","Reason","Timestamp","Mode"]];students.forEach(student=>{const record=attendance[getStudentKey(student)]||{};rows.push([document.getElementById("sessionDate").value,document.getElementById("sessionName").value,student.name,student.className,student.group,record.status||"Unmarked",record.reason||"",record.timestamp||"",record.mode||""])});const csv=rows.map(row=>row.map(cell=>`"${String(cell).replaceAll('"','""')}"`).join(",")).join("\n");const blob=new Blob([csv],{type:"text/csv"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`attendance_${document.getElementById("sessionDate").value}.csv`;a.click();URL.revokeObjectURL(url)}
function clearLocalAttendance(){if(!confirm("Clear local marks for this session on this device?"))return;attendance={};saveLocalAttendance();renderStudents()}
document.getElementById("sessionDate").addEventListener("change",()=>{loadLocalAttendance();renderStudents()});document.getElementById("sessionName").addEventListener("change",()=>{loadLocalAttendance();renderStudents()});document.getElementById("groupFilter").addEventListener("change",renderStudents);document.getElementById("searchInput").addEventListener("input",renderStudents);
loadStudents();
</script>
</body>
</html>
