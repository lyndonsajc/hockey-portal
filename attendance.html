<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hockey Attendance</title>
  <style>
    :root{--blue:#123c69;--blue2:#1f5f99;--green:#15803d;--green-bg:#dcfce7;--red:#b91c1c;--red-bg:#fee2e2;--purple:#6d28d9;--purple-bg:#ede9fe;--border:#d1d5db;--dark:#1f2937}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;color:var(--dark)}header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;padding:18px 12px;text-align:center}header h1{margin:0;font-size:24px}.container{max-width:1100px;margin:12px auto;padding:0 10px 28px}.panel{background:white;border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.04)}.top-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.session-title{font-weight:bold;color:var(--blue);font-size:18px}.session-meta{font-size:13px;color:#6b7280;margin-top:4px}.btn{border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-weight:bold;cursor:pointer;background:white;color:var(--blue);text-decoration:none;display:inline-block;font-size:13px}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.search-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}input,select{width:100%;padding:9px;border:1px solid var(--border);border-radius:10px;font-size:14px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team-summary{border:1px solid var(--border);border-radius:12px;padding:10px;background:white}.team-title{font-weight:bold;color:var(--blue);margin-bottom:8px}.team-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center}.stat .num{font-size:22px;font-weight:bold}.stat .label{font-size:11px;color:#4b5563;font-weight:bold}.present{background:var(--green-bg);color:var(--green)}.absent{background:var(--red-bg);color:var(--red)}.mc{background:var(--purple-bg);color:var(--purple)}.student-list{display:flex;flex-direction:column;gap:8px;max-height:760px;overflow-y:auto;padding-right:4px}.student-card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:9px}.student-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.name{font-weight:bold;color:var(--blue);font-size:15px}.meta{font-size:12px;color:#6b7280;margin-top:2px}.pill{border-radius:999px;padding:4px 7px;font-size:11px;font-weight:bold;background:#f3f4f6;color:#374151;white-space:nowrap}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.att-btn{border:none;border-radius:9px;padding:9px 4px;font-size:12px;font-weight:bold;cursor:pointer}.att-btn.present{background:var(--green-bg);color:var(--green)}.att-btn.absent{background:var(--red-bg);color:var(--red)}.att-btn.mc{background:var(--purple-bg);color:var(--purple)}.details{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:7px}.reason{font-size:12px;padding:8px}.timestamp{font-size:11px;color:#6b7280;margin-top:5px}.loading,.empty,.error{background:white;border:1px dashed var(--border);border-radius:14px;padding:18px;text-align:center;color:#6b7280}.error{border-color:#fca5a5;color:#991b1b;background:#fff5f5}@media(max-width:760px){header h1{font-size:21px}.top-row{grid-template-columns:1fr}.summary-grid{grid-template-columns:1fr}.team-stats{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(3,1fr)}.details{grid-template-columns:1fr}.btn{font-size:12px;padding:8px 10px}}
  </style>
</head>
<body>
<header><h1>Hockey Attendance</h1></header>
<main class="container">
  <section class="panel">
    <div class="top-row">
      <div>
        <div id="sessionTitle" class="session-title">Loading session...</div>
        <div id="sessionMeta" class="session-meta"></div>
      </div>
      <a class="btn" href="index.html">← Back to Schedule</a>
    </div>
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="Search name, class or group..." />
      <button class="btn primary" onclick="refreshAll()">Refresh</button>
    </div>
  </section>

  <section class="panel">
    <div class="summary-grid">
      <div class="team-summary">
        <div class="team-title">👦 Boys</div>
        <div class="team-stats">
          <div class="stat"><div id="boysTotal" class="num">0</div><div class="label">Total</div></div>
          <div class="stat present"><div id="boysPresent" class="num">0</div><div class="label">Present</div></div>
          <div class="stat absent"><div id="boysAbsent" class="num">0</div><div class="label">Absent</div></div>
          <div class="stat mc"><div id="boysMc" class="num">0</div><div class="label">MC/PL</div></div>
        </div>
      </div>
      <div class="team-summary">
        <div class="team-title">👧 Girls</div>
        <div class="team-stats">
          <div class="stat"><div id="girlsTotal" class="num">0</div><div class="label">Total</div></div>
          <div class="stat present"><div id="girlsPresent" class="num">0</div><div class="label">Present</div></div>
          <div class="stat absent"><div id="girlsAbsent" class="num">0</div><div class="label">Absent</div></div>
          <div class="stat mc"><div id="girlsMc" class="num">0</div><div class="label">MC/PL</div></div>
        </div>
      </div>
    </div>
  </section>

  <section id="studentList" class="student-list"><div class="loading">Loading students...</div></section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, setDoc, getDocs, collection, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTKW9nlCQK-1ktvEu8at4-KRLjIwbz660",
    authDomain: "saintshockeyattendance.firebaseapp.com",
    projectId: "saintshockeyattendance",
    storageBucket: "saintshockeyattendance.firebasestorage.app",
    messagingSenderId: "717790587080",
    appId: "1:717790587080:web:cd9e1a07d580566f3f1dfd"
  };

  const STUDENT_CSV_URL = "";
  const SCHEDULE_CSV_URL = "https://docs.google.com/spreadsheets/d/1nH3Jvm1XFFqA52Sj7I0Swll9DU5yUOqv0ddr21zWEgw/export?format=csv&gid=0";
  const UPLOAD_LINK = "https://docs.google.com/forms/d/e/1FAIpQLSeWelhY6SsCrPo2g-GGByH33dAS0hx26AygKzQrtOgqWbay3A/viewform?usp=header";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let students = [];
  let attendance = {};
  let selectedSession = null;
  let unsubscribe = null;

  function escapeHtml(text){return String(text ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
  function slug(text){return String(text ?? "").trim().replace(/[^a-zA-Z0-9_-]/g,"_")}
  function studentId(s){return slug(`${s.name}_${s.className}`)}
  function makeSessionId(item){return `${item.dateISO || item.date}_${item.day || ""}_${item.start || ""}_${item.end || ""}_${item.venue || ""}`.replace(/[^a-zA-Z0-9_-]/g,"_")}
  function isBoy(s){const g=String(s.gender||"").trim().toUpperCase();const t=`${s.group} ${s.gender}`.toLowerCase();return g==="M"||t.includes("boy")||t.includes("male")}
  function isGirl(s){const g=String(s.gender||"").trim().toUpperCase();const t=`${s.group} ${s.gender}`.toLowerCase();return g==="F"||t.includes("girl")||t.includes("female")}

  function parseCSV(text){
    const rows=[];let row=[],cell="",quote=false;
    for(let i=0;i<text.length;i++){
      const c=text[i],n=text[i+1];
      if(c==='"'&&quote&&n==='"'){cell+='"';i++;}
      else if(c==='"'){quote=!quote;}
      else if(c===','&&!quote){row.push(cell.trim());cell="";}
      else if((c==='\n'||c==='\r')&&!quote){if(cell||row.length){row.push(cell.trim());rows.push(row);row=[];cell="";}if(c==='\r'&&n==='\n')i++;}
      else{cell+=c;}
    }
    if(cell||row.length){row.push(cell.trim());rows.push(row);}
    return rows;
  }

  function normaliseHeader(h){return String(h||"").toLowerCase().replace(/\s+/g,"")}

  async function loadStudents(){
    students = [
      {name:"Leonard Ong Teng Yong (Wang Dingrong)",className:"26A01",group:"Boys",gender:"M"},
      {name:"Lim Jiaxuan, Jessica Faith",className:"26A02",group:"Girls",gender:"F"},
      {name:"Ho Wen Jie",className:"26A03",group:"Boys",gender:"M"},
      {name:"Kan Wing, Lucien",className:"26A03",group:"Boys",gender:"M"},
      {name:"Lily Anne Timms",className:"26A03",group:"Girls",gender:"F"},
      {name:"Seeto Zhi Yuan, Benjamin",className:"26A03",group:"Boys",gender:"M"},
      {name:"Tay Yu Qin Jensen",className:"26A03",group:"Boys",gender:"M"},
      {name:"Ye Junhao",className:"26A04",group:"Boys",gender:"M"},
      {name:"Cherlize Agnes Loi Yu Jing",className:"26A05",group:"Girls",gender:"F"},
      {name:"Low Wei Min",className:"26A05",group:"Girls",gender:"F"},
      {name:"Chan Yu Qin, Sarah",className:"26A06",group:"Girls",gender:"F"},
      {name:"Ying Yin Ci",className:"26A06",group:"Girls",gender:"F"},
      {name:"Axton Lee Yun Heng",className:"26S01",group:"Boys",gender:"M"},
      {name:"Fan Zicheng",className:"26S01",group:"Boys",gender:"M"},
      {name:"Avril Natalie Tang Shuet Wing",className:"26S02",group:"Girls",gender:"F"},
      {name:"Raja Yogatheepan",className:"26S02",group:"Boys",gender:"M"},
      {name:"Aadit Ajay Wadkar",className:"26S03",group:"Boys",gender:"M"},
      {name:"Lavonne Teo Swee Hian (Zhang Ruixuan)",className:"26S03",group:"Girls",gender:"F"},
      {name:"Sarah Fathima Mohamed Habubakkar",className:"26S04",group:"Girls",gender:"F"},
      {name:"Tan Qi Xuan",className:"26S05",group:"Girls",gender:"F"},
      {name:"Jaren Choi Yaoxiang (Cui Yaoxiang)",className:"26S06",group:"Boys",gender:"M"},
      {name:"Moiiesha Nathan-Koh",className:"26S07",group:"Girls",gender:"F"},
      {name:"Chezelle Shanysse Ten Tse Mynn",className:"26S08",group:"Girls",gender:"F"},
      {name:"Chia Mei Qi",className:"26S09",group:"Girls",gender:"F"},
      {name:"Lin Yuanhao",className:"26S09",group:"Boys",gender:"M"},
      {name:"Low Yu Ren Ray (Liu Yuren)",className:"26S09",group:"Boys",gender:"M"},
      {name:"Hee Xin Rui (Xu Xinrui)",className:"26S14",group:"Girls",gender:"F"},
      {name:"Justin Wang Haoyang",className:"26S14",group:"Boys",gender:"M"},
      {name:"Yogalakshme Balamurugan",className:"26S14",group:"Girls",gender:"F"},
      {name:"Kor Shi Mun, Rachel",className:"26S15",group:"Girls",gender:"F"},
      {name:"Natasha Ann Yong",className:"26S15",group:"Girls",gender:"F"},
      {name:"Leong Jim",className:"26S17",group:"Boys",gender:"M"},
      {name:"Sarah Tan Li Ying",className:"26S17",group:"Girls",gender:"F"},
      {name:"Faith Huang Jia'En",className:"26S18",group:"Girls",gender:"F"},
      {name:"Matias Ang Suan Kai",className:"26S20",group:"Boys",gender:"M"},
      {name:"Gu Jiachang",className:"26S21",group:"Boys",gender:"M"},
      {name:"Jairus Tan Shi Zhe (Chen Shizhe)",className:"26S21",group:"Boys",gender:"M"},
      {name:"Tan Wen Shan, Colin (Chen Wenshan)",className:"26S21",group:"Boys",gender:"M"},
      {name:"Andre Zhang Yuhan",className:"26S22",group:"Boys",gender:"M"},
      {name:"Reyhaan Jett Bhandari",className:"26S22",group:"Boys",gender:"M"},
      {name:"Thien Kai Xin Christie",className:"26S22",group:"Girls",gender:"F"},
      {name:"Ng Wei Jun (Huang Weijun)",className:"26S23",group:"Girls",gender:"F"}
    ];
  }

  async function loadSession(){
    const params = new URLSearchParams(window.location.search);
    const sessionParam = params.get("session");
    const res = await fetch(SCHEDULE_CSV_URL + "&cache=" + Date.now());
    const text = await res.text();
    const rows = parseCSV(text);
    const headers = rows[0].map(normaliseHeader);
    const sessions = rows.slice(1).filter(r=>r.some(c=>String(c).trim()!=="")).map(row=>{
      const obj={}; headers.forEach((h,i)=>obj[h]=row[i]||"");
      const item = {term:obj.term||"",date:obj.date||"",dateISO:obj.dateiso||"",day:obj.day||"",start:obj.starttime||obj.start||"",end:obj.endtime||obj.end||"",venue:obj.venue||"",remarks:obj.remarks||"Training",coach:obj.coach||"",tic:obj.tic||""};
      item.id = makeSessionId(item);
      return item;
    });
    selectedSession = sessions.find(s=>s.id===sessionParam) || sessions[0] || {id:"manual_session",date:"",day:"",start:"",end:"",venue:"",remarks:"Attendance"};
    document.getElementById("sessionTitle").textContent = `${selectedSession.date} ${selectedSession.day} ${selectedSession.start}–${selectedSession.end}`;
    document.getElementById("sessionMeta").textContent = `${selectedSession.venue || ""} ${selectedSession.remarks ? "• " + selectedSession.remarks : ""}`;
  }

  function listenAttendance(){
    if(unsubscribe) unsubscribe();
    const recordsRef = collection(db,"attendance",selectedSession.id,"records");
    unsubscribe = onSnapshot(recordsRef, snap=>{
      attendance = {};
      snap.forEach(d=>attendance[d.id]=d.data());
      renderStudents();
      updateSummary();
    }, err=>{
      console.error(err);
      document.getElementById("studentList").innerHTML = `<div class="error">Firebase read failed. Check Firestore test mode/rules.</div>`;
    });
  }

  async function markAttendance(index,status){
    const s = students[index];
    const id = studentId(s);
    const reasonInput = document.getElementById(`reason-${index}`);
    const reason = reasonInput ? reasonInput.value : "";
    const payload = {studentId:id,name:s.name,className:s.className,group:s.group,gender:s.gender,status,reason,sessionId:selectedSession.id,session:selectedSession,timestamp:new Date().toLocaleString("en-SG",{hour12:false}),updatedAt:serverTimestamp()};
    await setDoc(doc(db,"attendance",selectedSession.id,"records",id), payload, {merge:true});
  }

  async function saveReason(index,value){
    const s = students[index];
    const id = studentId(s);
    const existing = attendance[id] || {};
    await setDoc(doc(db,"attendance",selectedSession.id,"records",id), {studentId:id,name:s.name,className:s.className,group:s.group,gender:s.gender,status:existing.status||"",reason:value,sessionId:selectedSession.id,session:selectedSession,timestamp:new Date().toLocaleString("en-SG",{hour12:false}),updatedAt:serverTimestamp()}, {merge:true});
  }

  function renderStudents(){
    const q = document.getElementById("searchInput").value.toLowerCase();
    const filtered = students.filter(s=>`${s.name} ${s.className} ${s.group}`.toLowerCase().includes(q));
    const list = document.getElementById("studentList");
    if(!filtered.length){list.innerHTML=`<div class="empty">No students found.</div>`;return;}
    list.innerHTML = filtered.map(s=>{
      const index = students.indexOf(s);
      const record = attendance[studentId(s)] || {};
      const status = record.status || "Unmarked";
      return `<article class="student-card"><div class="student-top"><div><div class="name">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.className)} ${s.group?"• "+escapeHtml(s.group):""}</div></div><div class="pill ${status==='Present'?'present':status==='Absent'?'absent':status==='MC/Parent Letter'?'mc':''}">${escapeHtml(status)}</div></div><div class="actions"><button class="att-btn present" onclick="markAttendance(${index}, 'Present')">✅ Present</button><button class="att-btn absent" onclick="markAttendance(${index}, 'Absent')">❌ Absent</button><button class="att-btn mc" onclick="markAttendance(${index}, 'MC/Parent Letter')">📄 MC/PL</button></div><div class="details"><input class="reason" id="reason-${index}" value="${escapeHtml(record.reason||"")}" placeholder="Reason for absence" onchange="saveReason(${index}, this.value)" /><a class="btn" href="${UPLOAD_LINK}" target="_blank">Upload</a></div><div class="timestamp">${record.timestamp?"Updated: "+escapeHtml(record.timestamp):"Not marked yet"}</div></article>`;
    }).join("");
  }

  function updateSummary(){
    const boys = students.filter(isBoy), girls = students.filter(isGirl);
    const count = (arr,status)=>arr.filter(s=>(attendance[studentId(s)]||{}).status===status).length;
    document.getElementById("boysTotal").textContent=boys.length;
    document.getElementById("girlsTotal").textContent=girls.length;
    document.getElementById("boysPresent").textContent=count(boys,"Present");
    document.getElementById("girlsPresent").textContent=count(girls,"Present");
    document.getElementById("boysAbsent").textContent=count(boys,"Absent");
    document.getElementById("girlsAbsent").textContent=count(girls,"Absent");
    document.getElementById("boysMc").textContent=count(boys,"MC/Parent Letter");
    document.getElementById("girlsMc").textContent=count(girls,"MC/Parent Letter");
  }

  async function refreshAll(){
    document.getElementById("studentList").innerHTML = `<div class="loading">Loading students...</div>`;
    await loadSession();
    await loadStudents();
    renderStudents();
    updateSummary();
    listenAttendance();
  }

  document.getElementById("searchInput").addEventListener("input",renderStudents);
  window.markAttendance = markAttendance;
  window.saveReason = saveReason;
  window.refreshAll = refreshAll;
  refreshAll();
</script>
</body>
</html>
